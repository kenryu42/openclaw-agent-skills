name: sync-upstream

# Fork-only: replay this fork's patch commits onto openclaw/agent-skills main.
# SYNC_TOKEN is a fine-grained token for this repository with Contents and
# Workflows write access; GITHUB_TOKEN cannot push upstream workflow changes.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  FAILURE_TITLE: Upstream sync failed

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Rebase patch commits onto upstream
        id: rebase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/openclaw/agent-skills.git main
          upstream=$(git rev-parse FETCH_HEAD)
          echo "previous=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rebase "$upstream"; then
            git status --short
            git rebase --abort
            echo "::error::patch commits conflict with upstream ${upstream}"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.rebase.outputs.changed == 'true'
        with:
          node-version: '26.10.0'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.rebase.outputs.changed == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check rebased skills
        if: steps.rebase.outputs.changed == 'true'
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts
          python scripts/check-skills --group all
          python -m unittest skills.autoreview.tests.test_exclude_pathspecs
      - name: Publish
        if: steps.rebase.outputs.changed == 'true'
        run: git push --force-with-lease=main:${{ steps.rebase.outputs.previous }} origin HEAD:main
      - name: Close failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --state open --search "in:title \"$FAILURE_TITLE\"" --json number --jq '.[].number' |
            while read -r number; do
              gh issue close "$number" --comment "Synced with upstream ${{ steps.rebase.outputs.upstream }}."
            done
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Upstream ${{ steps.rebase.outputs.upstream }} could not be synced; main is unchanged. Rebase locally, fix, and force-push main. Run: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$FAILURE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$FAILURE_TITLE" --body "$body"
          fi
